<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>陪诊师平台 · 订单状态机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fafbfc; --paper-2:#ffffff;
    --ink:#1f3a4d; --muted:#6b8294; --soft:#97a7b6;
    --rule:#e5eaf0; --rule-solid:#cdd7e0;
    --accent:#1a8f7a; --accent-tint:rgba(26,143,122,0.10);
    --accent-deep:#0f6b5a; --link:#2e5aa8;
    --danger:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Geist','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:48px 32px;}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:36px;line-height:1.2;margin:0 0 8px;color:var(--ink);letter-spacing:.005em}
  .subtitle{font-family:'Geist',sans-serif;font-size:14px;color:var(--muted);margin-bottom:32px;max-width:820px;line-height:1.6}
  .diagram{background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:24px;overflow-x:auto}
  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .legend{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule);font-family:'Geist Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
  .legend-item{display:inline-flex;align-items:center;gap:8px}
  .legend-swatch{width:12px;height:12px;border-radius:50%;border:1px solid var(--rule-solid)}
  .legend-swatch.focal{background:var(--accent-tint);border-color:var(--accent);border-radius:3px}
  .legend-swatch.term{background:#ffffff;border-color:var(--ink);border-radius:50%}
  .legend-swatch.normal{background:#ffffff;border-color:var(--ink);border-radius:3px}
  .legend-swatch.danger{background:rgba(192,57,43,0.06);border-color:var(--danger);border-radius:3px}
  .colophon{margin-top:32px;font-family:'Geist Mono',monospace;font-size:10px;color:var(--soft);letter-spacing:.06em;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">DIAGRAM · 07 / STATE MACHINE</p>
  <h1>订单全生命周期状态机</h1>
  <p class="subtitle">11 个状态、14 条主路径；任何状态变更都写 <code>order_event</code> 审计表。焦点落在匹配与结算链路。</p>

  <div class="diagram">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="sm07-title sm07-desc">
<title id="sm07-title">订单状态机</title>
<desc id="sm07-desc">订单从 created 出发，可进入 paid、closed、matching；matching 可进入 accepted 或 refunding；accepted 进入 in_service；in_service 可到 completed 或 disputed；completed 进入 reviewed 或 refunding；reviewed 进入 settled；refunding 进入 refunded；disputed 可判定为 completed 或 refunding。终点状态为 settled、refunded、closed。</desc>

<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b8294"/></marker>
  <marker id="arr-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a8f7a"/></marker>
  <marker id="arr-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0392b"/></marker>
</defs>

<!-- ============== STATES ============== -->

<!-- created -->
<rect x="80" y="120" width="120" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="140" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">INITIAL</text>
<text x="140" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">created</text>

<!-- paid -->
<rect x="240" y="120" width="120" height="56" rx="6" fill="rgba(26,143,122,0.10)" stroke="#1a8f7a" stroke-width="1.2"/>
<text x="300" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.08em">PAY</text>
<text x="300" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#0f6b5a" text-anchor="middle">paid</text>

<!-- closed (terminal) -->
<rect x="80" y="240" width="120" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="140" y="258" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
<text x="140" y="278" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">closed</text>
<circle cx="86" cy="248" r="6" fill="#1f3a4d"/>
<circle cx="194" cy="248" r="6" fill="#1f3a4d"/>
<line x1="92" y1="248" x2="188" y2="248" stroke="#1f3a4d" stroke-width="1"/>

<!-- matching (FOCAL) -->
<rect x="400" y="120" width="140" height="56" rx="6" fill="rgba(26,143,122,0.10)" stroke="#1a8f7a" stroke-width="1.2"/>
<text x="470" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
<text x="470" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#0f6b5a" text-anchor="middle">matching</text>

<!-- accepted -->
<rect x="580" y="120" width="120" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="640" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">MATCHED</text>
<text x="640" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">accepted</text>

<!-- in_service -->
<rect x="740" y="120" width="140" height="56" rx="6" fill="rgba(26,143,122,0.10)" stroke="#1a8f7a" stroke-width="1.2"/>
<text x="810" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.08em">FOCAL</text>
<text x="810" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#0f6b5a" text-anchor="middle">in_service</text>

<!-- completed -->
<rect x="920" y="120" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="990" y="144" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">DONE</text>
<text x="990" y="164" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">completed</text>

<!-- reviewed -->
<rect x="920" y="240" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="990" y="264" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">REVIEWED</text>
<text x="990" y="284" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">reviewed</text>

<!-- settled (terminal) -->
<rect x="920" y="360" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="990" y="378" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
<text x="990" y="398" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#1f3a4d" text-anchor="middle">settled</text>
<circle cx="926" cy="368" r="6" fill="#1f3a4d"/>
<circle cx="1054" cy="368" r="6" fill="#1f3a4d"/>
<line x1="932" y1="368" x2="1048" y2="368" stroke="#1f3a4d" stroke-width="1"/>

<!-- disputed -->
<rect x="580" y="240" width="140" height="56" rx="6" fill="rgba(192,57,43,0.06)" stroke="#c0392b" stroke-width="1"/>
<text x="650" y="264" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.08em">DISPUTE</text>
<text x="650" y="284" font-size="13" font-family="'Geist',sans-serif" font-weight="600" fill="#c0392b" text-anchor="middle">disputed</text>

<!-- refunding -->
<rect x="400" y="360" width="120" height="56" rx="6" fill="rgba(192,57,43,0.06)" stroke="#c0392b" stroke-width="1"/>
<text x="460" y="384" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.08em">REFUND</text>
<text x="460" y="404" font-size="13" font-family:'Geist',sans-serif; font-weight="600" fill="#c0392b" text-anchor="middle">refunding</text>

<!-- refunded (terminal) -->
<rect x="400" y="480" width="120" height="56" rx="6" fill="#ffffff" stroke="#1f3a4d" stroke-width="1"/>
<text x="460" y="498" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
<text x="460" y="518" font-size="13" font-family:'Geist',sans-serif; font-weight="600" fill="#1f3a4d" text-anchor="middle">refunded</text>
<circle cx="406" cy="488" r="6" fill="#1f3a4d"/>
<circle cx="514" cy="488" r="6" fill="#1f3a4d"/>
<line x1="412" y1="488" x2="508" y2="488" stroke="#1f3a4d" stroke-width="1"/>

<!-- ============ ARROWS ============ -->

<!-- created → paid -->
<path d="M 200 148 L 240 148" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="200" y="128" width="40" height="12" rx="2" fill="#fafbfc"/>
<text x="220" y="138" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">PAY</text>

<!-- created → closed -->
<path d="M 140 176 L 140 240" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="146" y="200" width="64" height="12" rx="2" fill="#fafbfc"/>
<text x="178" y="210" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">TIMEOUT</text>

<!-- paid → matching -->
<path d="M 360 148 L 400 148" fill="none" stroke="#1a8f7a" stroke-width="1.4" marker-end="url(#arr-acc)"/>
<rect x="362" y="128" width="36" height="12" rx="2" fill="#fafbfc"/>
<text x="380" y="138" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.06em">QUEUE</text>

<!-- matching → accepted -->
<path d="M 540 148 L 580 148" fill="none" stroke="#1a8f7a" stroke-width="1.4" marker-end="url(#arr-acc)"/>
<rect x="544" y="128" width="32" height="12" rx="2" fill="#fafbfc"/>
<text x="560" y="138" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.06em">GRAB</text>

<!-- accepted → in_service -->
<path d="M 700 148 L 740 148" fill="none" stroke="#1a8f7a" stroke-width="1.4" marker-end="url(#arr-acc)"/>
<rect x="702" y="128" width="36" height="12" rx="2" fill="#fafbfc"/>
<text x="720" y="138" font-size="8" font-family="'Geist Mono',monospace" fill="#0f6b5a" text-anchor="middle" letter-spacing="0.06em">CHECKIN</text>

<!-- in_service → completed -->
<path d="M 880 148 L 920 148" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="884" y="128" width="36" height="12" rx="2" fill="#fafbfc"/>
<text x="902" y="138" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">FINISH</text>

<!-- completed → reviewed -->
<path d="M 990 176 L 990 240" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="998" y="200" width="44" height="12" rx="2" fill="#fafbfc"/>
<text x="1020" y="210" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">RATE</text>

<!-- reviewed → settled -->
<path d="M 990 296 L 990 360" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="998" y="320" width="44" height="12" rx="2" fill="#fafbfc"/>
<text x="1020" y="330" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">T+7</text>

<!-- in_service → disputed -->
<path d="M 810 176 L 720 240" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-danger)"/>
<rect x="754" y="200" width="48" height="12" rx="2" fill="#fafbfc"/>
<text x="778" y="210" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.06em">COMPLAIN</text>

<!-- completed → disputed -->
<path d="M 920 168 L 720 240" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-danger)"/>

<!-- matching → refunding -->
<path d="M 470 176 L 470 360" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-danger)"/>
<rect x="478" y="258" width="56" height="12" rx="2" fill="#fafbfc"/>
<text x="506" y="268" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text>

<!-- completed → refunding -->
<path d="M 920 200 L 540 388" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-danger)"/>
<rect x="680" y="280" width="56" height="12" rx="2" fill="#fafbfc"/>
<text x="708" y="290" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.06em">REFUND REQ</text>

<!-- disputed → completed -->
<path d="M 650 296 L 920 200" fill="none" stroke="#6b8294" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr)"/>
<rect x="780" y="252" width="48" height="12" rx="2" fill="#fafbfc"/>
<text x="804" y="262" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">DISMISS</text>

<!-- disputed → refunding -->
<path d="M 580 280 L 520 380" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-danger)"/>
<rect x="530" y="320" width="36" height="12" rx="2" fill="#fafbfc"/>
<text x="548" y="330" font-size="8" font-family="'Geist Mono',monospace" fill="#c0392b" text-anchor="middle" letter-spacing="0.06em">Uphold</text>

<!-- refunding → refunded -->
<path d="M 460 416 L 460 480" fill="none" stroke="#6b8294" stroke-width="1" marker-end="url(#arr)"/>
<rect x="466" y="438" width="44" height="12" rx="2" fill="#fafbfc"/>
<text x="488" y="448" font-size="8" font-family="'Geist Mono',monospace" fill="#6b8294" text-anchor="middle" letter-spacing="0.06em">DONE</text>

<!-- ============== GUARDRAILS ============== -->
<rect x="80" y="600" width="1000" height="120" rx="6" fill="rgba(31,58,77,0.04)" stroke="#6b8294" stroke-width="1" stroke-dasharray="5,3"/>
<text x="100" y="624" font-family="'Geist Mono',monospace" font-size="9" fill="#6b8294" letter-spacing="0.10em">GUARDRAILS · 不变量</text>

<g transform="translate(100, 642)" font-size="10" font-family="'Geist',sans-serif" fill="#1f3a4d">
  <text y="0">· <tspan font-weight="600">每次状态变更</tspan>必须写入 order_event（操作人、时间、前后值、原因）</text>
  <text y="20">· <tspan font-weight="600">只有正向路径</tspan>（created→paid→matching→accepted→in_service→completed→reviewed→settled）允许自动跳转</text>
  <text y="40">· <tspan font-weight="600">退款 / 申诉 / 异常</tspan>状态变更必须客服介入或风控规则触发</text>
  <text y="60">· <tspan font-weight="600">终态不可逆</tspan>（closed / settled / refunded）；如需纠错，开"补偿订单"而非改原订单</text>
</g>

</svg>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-swatch normal"></span>普通状态</span>
    <span class="legend-item"><span class="legend-swatch focal"></span>焦点状态（主链路）</span>
    <span class="legend-item"><span class="legend-swatch danger"></span>异常/争议状态</span>
    <span class="legend-item"><span class="legend-swatch term"></span>终态（不可逆）</span>
  </div>

  <p class="colophon">docs/diagrams/07-order-state-machine.html · v1.0 · 医疗蓝绿主题</p>
</div>
</body>
</html>
