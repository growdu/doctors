<div class="wrap">
  <p class="eyebrow">DIAGRAM · 03 / LAYER STACK · COMPENSATING CONTROLS</p>
  <h1>安全与合规分层 · 深度防御</h1>
  <p class="subtitle">按"用户 → 接入 → 应用 → 数据 → 资金 → 运维"分层堆叠控制项；每层缺失时由下一层补偿，形成纵深防御（Defense in Depth）。</p>

<title id="sec03-title">安全与合规分层架构</title>
<desc id="sec03-desc">六层纵深防御：用户层（实名、活体、设备指纹）、接入层（HTTPS、WAF、限流）、应用层（鉴权、防重放、防爬、SQL 注入防护）、数据层（加密、审计、脱敏）、资金层（隔离、对账、风控、二次校验）、运维层（堡垒机、审计、备份、演练）。焦点落在资金层与数据层。</desc>

</defs>
