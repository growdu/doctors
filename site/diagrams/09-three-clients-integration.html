  <h1>三端集成对比 · iOS / Android / 小程序</h1>
  <p class="subtitle">三端共享同一套后端 API 与账号体系，但在微信生态对接、原生能力、推送通道上存在差异；下表与图共同描述关键接入差异点。</p>

<title id="tcli09-title">三端集成对比架构</title>
<desc id="tcli09-desc">三个客户端并排：iOS App、Android App、微信小程序；每个客户端分别连接到原生能力层、微信 SDK 层、推送通道层，最后统一经 API 网关接入后端服务。差异点用颜色标注：小程序独有微信登录和模板消息；iOS/Android 独有 APNs/FCM 和原生 GPS。</desc>
