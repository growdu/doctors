name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Pages 部署需要 pages:write + id-token:write 权限（GitHub 推荐 OIDC）。
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install mkdocs + material theme + pymdownx
        run: pip install --no-cache-dir -r requirements-docs.txt

      - name: Build (strict mode)
        run: mkdocs build --strict --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4