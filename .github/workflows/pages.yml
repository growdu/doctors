name: Pages

# GitHub Pages 部署（mkdocs-material 构建版）：
#   - trigger：push to main（docs/** + dev.md + mkdocs.yml + pages.yml 改动时）
#   - build：pip install mkdocs-material + mkdocs build --strict → site/
#   - artifact：site/（mkdocs 完整静态站，含 search/ + assets/）
#   - deploy：actions/deploy-pages@v4（OIDC，无需 PAT）
#   - permissions：contents: read + pages: write + id-token: write
#   - 含 docs-build 严格模式（--strict）：broken nav / missing anchor 即红
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dev.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages 部署需要 pages:write + id-token:write（OIDC）。
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & upload docs artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install mkdocs-material
        run: pip install -r requirements-docs.txt

      # mkdocs --strict：broken nav / missing anchor 即失败。
      # nav 漏挂文件 / 锚点失效都会让 PR 红，强制 docs 维护纪律。
      - name: mkdocs build --strict
        run: mkdocs build --strict --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4