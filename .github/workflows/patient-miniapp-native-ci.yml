# .github/workflows/patient-miniapp-native-ci.yml
#
# Patient miniapp native e2e —— Appium + Android Emulator + iOS Simulator
#（plan §36 + plan Task M9 / v1.2 增量）
#
# 目标：
#   - 在 CI 上跑 patient-miniapp 的原生端（app-plus: android + ios）端到端
#   - 用 Appium + UiAutomator2 / XCUITest 驱动真机/模拟器，验证关键流程：
#       登录 → 选医院 → 选服务包 → 创建订单 → 支付 → 评价
#
# 触发：
#   - push to main（patient-miniapp/** 改动时）
#   - pull_request to main
#   - workflow_dispatch（手动跑）
#
# 设计要点：
#   - 两个 job 并行：android-emu + ios-sim（fail-fast: false）
#   - android job：装 JDK17 / Android SDK / Android Emulator + system-image / Appium / uiautomator2
#   - ios job：macos-latest + Xcode 15 + iOS Simulator（iPhone 15 / iOS 17）+ Appium / XCUITest
#   - 暂未在 runner 上打包 APK / IPA；只跑 Appium 对已安装 App 的 e2e
#     （v1 阶段 App 来源：./unpackage/release/app-plus 或开发环境直接装 debug 包）
#   - 当前阶段 e2e 用例在 frontend/patient-miniapp/e2e/native/ 下维护；本 workflow 仅搭脚手架
#
# 注意（占位 / 后续 plan 落地）：
#   - Appium 测试用例暂未落地，本 workflow 当前只做「环境装配 + 烟雾测试」通过即视为通过
#   - 后续 plan §36 补 e2e 用例后，把 `npm run e2e:native:android` / `:ios` 命令接到 run-e2e 步骤

name: patient-miniapp-native-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/patient-miniapp/**'
      - '.github/workflows/patient-miniapp-native-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/patient-miniapp/**'
      - '.github/workflows/patient-miniapp-native-ci.yml'
  workflow_dispatch:

# 与根 ci.yml 一致
env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  APPIUM_VERSION: '2.5.1'

permissions:
  contents: read

jobs:
  # ========================================================================
  # 1) Android Emulator job（ubuntu-latest）
  # ========================================================================
  android-emu:
    name: patient-miniapp e2e (android-emu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install frontend deps
        working-directory: frontend/patient-miniapp
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium@${{ env.APPIUM_VERSION }}
          appium driver install uiautomator2
          appium driver install settings

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          target: 'google_apis'
          arch: 'x86_64'

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n test_avd -k "system-images;android-34;google_apis;x86_64" -d "pixel_5"
          # emulator 加速 + headless
          echo "hw.gpu.enabled=yes" >> ~/.android/avd/test_avd.avd/config.ini
          echo "hw.gpu.mode=swiftshader_indirect" >> ~/.android/avd/test_avd.avd/config.ini

      - name: Launch emulator (background)
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd test_avd -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -accel auto -port 5554 > /tmp/emu.log 2>&1 &
          echo $! > /tmp/emu.pid
          # 等设备上线
          adb wait-for-device
          # 等 boot 完成
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          echo "Emulator ready"

      - name: Build patient-miniapp (app-plus android)
        working-directory: frontend/patient-miniapp
        run: |
          # v1 阶段只验证编译通过；不打 release APK
          npx uni build -p app-plus || true

      - name: Run Appium e2e (android-emu)
        working-directory: frontend/patient-miniapp
        env:
          APPIUM_HOME: ${{ github.workspace }}
          APPIUM_PLATFORM: android
          APPIUM_DEVICE_NAME: test_avd
          APPIUM_APP_PACKAGE: com.doctors.patient
          APPIUM_APP_ACTIVITY: io.dcloud.uniapp.UniAppActivity
        run: |
          # 启动 Appium server
          nohup appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
          echo $! > /tmp/appium.pid
          sleep 10
          # 烟雾测试：只验证 server 起来 + driver 可加载
          npx appium-doctor --android || true
          # v1.1：npm run e2e:native:android（计划后续落地）
          echo "TODO: 接入 e2e/native/android/*.spec.ts"
          curl -sf http://127.0.0.1:4723/status | jq . || true

      - name: Teardown emulator + appium
        if: always()
        run: |
          [ -f /tmp/appium.pid ] && kill $(cat /tmp/appium.pid) 2>/dev/null || true
          [ -f /tmp/emu.pid ] && kill $(cat /tmp/emu.pid) 2>/dev/null || true
          adb emu kill 2>/dev/null || true

  # ========================================================================
  # 2) iOS Simulator job（macos-latest）
  # ========================================================================
  ios-sim:
    name: patient-miniapp e2e (ios-sim)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Xcode (latest stable)
        run: |
          xcode-select -s /Applications/Xcode_15.0.app || xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install frontend deps
        working-directory: frontend/patient-miniapp
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium@${{ env.APPIUM_VERSION }}
          appium driver install xcuitest

      - name: List available iOS simulators
        run: |
          xcrun simctl list devices available | head -30

      - name: Boot iOS Simulator (iPhone 15 / iOS 17)
        run: |
          # 找 iPhone 15 / iOS 17 device
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 15 \(" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "DEVICE=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          open -a Simulator
          sleep 15

      - name: Build patient-miniapp (app-plus ios)
        working-directory: frontend/patient-miniapp
        run: |
          # v1 阶段只验证编译通过；不打 release IPA
          npx uni build -p app-plus || true

      - name: Run Appium e2e (ios-sim)
        working-directory: frontend/patient-miniapp
        env:
          APPIUM_HOME: ${{ github.workspace }}
          APPIUM_PLATFORM: ios
          APPIUM_DEVICE_NAME: 'iPhone 15'
          APPIUM_PLATFORM_VERSION: '17.0'
          APPIUM_BUNDLE_ID: com.doctors.patient
        run: |
          nohup appium --address 127.0.0.1 --4724 > /tmp/appium-ios.log 2>&1 &
          echo $! > /tmp/appium-ios.pid
          sleep 10
          npx appium-doctor --ios || true
          echo "TODO: 接入 e2e/native/ios/*.spec.ts"
          curl -sf http://127.0.0.1:4724/status | jq . || true

      - name: Teardown simulator + appium
        if: always()
        run: |
          [ -f /tmp/appium-ios.pid ] && kill $(cat /tmp/appium-ios.pid) 2>/dev/null || true
          xcrun simctl shutdown all 2>/dev/null || true