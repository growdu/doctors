name: CI

# 4 job 并行：backend-test + docker-build + frontend-lint + backend-lint
# 设计原则：
#   - 全部 job 默认并行（无 needs 依赖）；
#   - matrix 拆分：11 Go 服务 / 14 镜像 / 3 前端 / 单 lint job；
#   - 触发：push to main + PR to main；
#   - 不 push 任何镜像 / 制品（load: true 本地加载验证）；
#   - Go / Node / Flutter 版本集中 env，便于统一升级。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOPROXY: https://goproxy.io,https://goproxy.cn,direct
  GOSUMDB: off
  GOTOOLCHAIN: local
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.24.0'
  GOLANGCI_LINT_VERSION: 'v1.61.0'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ========================================================================
  # 1) backend-test — matrix 跨 11 个 Go 服务
  #    每个 service 单独跑 vet + test -race，避免一处失败中断其它。
  # ========================================================================
  backend-test:
    name: backend-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - order
          - match
          - message
          - payment
          - review
          - sos
          - user
          - escort
          - wallet
          - admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./services/${{ matrix.service }}/...

      - name: go test
        # CI 默认按 10% 采样跑 trace（OTel 标准 env）：
        #   - 既保证 trace 链路完整（ParentBased 跟随上游），又显著降低后端存储 / exporter 带宽开销
        #   - 不需要改测试代码；运行时通过 OTEL_TRACES_SAMPLER 注入
        env:
          OTEL_TRACES_SAMPLER: traceidratio
          OTEL_TRACES_SAMPLER_ARG: parentbased_traceidratio
        run: go test -race -count=1 -timeout=120s -v ./services/${{ matrix.service }}/...

  # ========================================================================
  # 2) docker-build — matrix 跨 14 个镜像（11 Go + 3 frontend）
  #    使用 buildx + cache-from local，无 docker push；
  #    load: true 让镜像加载到 runner，校验构建成功。
  # ========================================================================
  docker-build:
    name: docker-build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 11 个 Go 服务（共享 Dockerfile + SVC build-arg）----
          - image: auth-service
            context: services/auth
            dockerfile: services/auth/Dockerfile
            build_args: SVC=auth
          - image: order-service
            context: services/order
            dockerfile: services/order/Dockerfile
            build_args: SVC=order
          - image: match-service
            context: services/match
            dockerfile: services/match/Dockerfile
            build_args: SVC=match
          - image: message-service
            context: services/message
            dockerfile: services/message/Dockerfile
            build_args: SVC=message
          - image: payment-service
            context: services/payment
            dockerfile: services/payment/Dockerfile
            build_args: SVC=payment
          - image: review-service
            context: services/review
            dockerfile: services/review/Dockerfile
            build_args: SVC=review
          - image: sos-service
            context: services/sos
            dockerfile: services/sos/Dockerfile
            build_args: SVC=sos
          - image: user-service
            context: services/user
            dockerfile: services/user/Dockerfile
            build_args: SVC=user
          - image: escort-service
            context: services/escort
            dockerfile: services/escort/Dockerfile
            build_args: SVC=escort
          - image: wallet-service
            context: services/wallet
            dockerfile: services/wallet/Dockerfile
            build_args: SVC=wallet
          - image: admin-service
            context: services/admin
            dockerfile: services/admin/Dockerfile
            build_args: SVC=admin
          # ---- 3 个 frontend 镜像 ----
          - image: admin-web
            context: frontend/admin-web
            dockerfile: frontend/admin-web/Dockerfile
            build_args: ''
          - image: patient-miniapp
            context: frontend/patient-miniapp
            dockerfile: frontend/patient-miniapp/Dockerfile
            build_args: ''
          - image: escort-app
            context: frontend/escort-app
            dockerfile: frontend/escort-app/Dockerfile
            build_args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.1

      - name: Cache (docker buildx)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.image }}
          key: ${{ runner.os }}-buildx-${{ matrix.image }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.image }}-

      - name: Build & load
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: doctors/${{ matrix.image }}:ci-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.image }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.image }}-new,mode=max

      - name: Image sanity check
        run: docker image inspect doctors/${{ matrix.image }}:ci-${{ github.sha }} > /dev/null

  # ========================================================================
  # 3) frontend-lint — matrix 3 端（admin-web + patient-miniapp + escort-app）
  #    每端约定不同：ESLint / Jest / flutter analyze；统一 working-directory。
  # ========================================================================
  frontend-lint:
    name: frontend-lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-web
            directory: frontend/admin-web
            setup: node
            command: npm install --no-audit --no-fund && npm run lint
          - name: patient-miniapp
            directory: frontend/patient-miniapp
            setup: node
            command: npm install --no-audit --no-fund && npm run test:unit
          - name: escort-app
            directory: frontend/escort-app
            setup: flutter
            command: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.setup == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Flutter
        if: matrix.setup == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Run lint / test
        run: ${{ matrix.command }}

  # ========================================================================
  # 4) backend-lint — golangci-lint run ./...
  # ========================================================================
  backend-lint:
    name: backend-lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" ${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...