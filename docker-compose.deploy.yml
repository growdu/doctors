    container_name: doctors-escort
    environment:
      DOCTORS_ESCORT_HTTP_ADDR: ":8080"
      DOCTORS_ESCORT_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_ESCORT_REDIS_ADDR: redis:6379
      DOCTORS_ESCORT_KAFKA_BROKERS: kafka:9092
      DOCTORS_ESCORT_KAFKA_GROUP_ID: escort-service
      DOCTORS_ESCORT_JWT_SECRET: dev-secret-change-me
      DOCTORS_ESCORT_LOGGING_LEVEL: info
    ports:
