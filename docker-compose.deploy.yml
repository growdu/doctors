      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  wallet-service:
    image: doctors/wallet:latest
    build:
      context: .
      dockerfile: services/wallet/Dockerfile
      args:
        SVC: wallet
    container_name: doctors-wallet
    environment:
      DOCTORS_WALLET_HTTP_ADDR: ":8080"
      DOCTORS_WALLET_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_WALLET_REDIS_ADDR: redis:6379
      DOCTORS_WALLET_KAFKA_BROKERS: kafka:9092
      DOCTORS_WALLET_KAFKA_GROUP_ID: wallet-service
      DOCTORS_WALLET_JWT_SECRET: dev-secret-change-me
      DOCTORS_WALLET_LOGGING_LEVEL: info
    ports:
      - "8090:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "-healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  admin-service:
    image: doctors/admin:latest
    build:
      context: .
      dockerfile: services/admin/Dockerfile
      args:
        SVC: admin
    container_name: doctors-admin
    environment:
      DOCTORS_ADMIN_HTTP_ADDR: ":8080"
      DOCTORS_ADMIN_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_ADMIN_REDIS_ADDR: redis:6379
      DOCTORS_ADMIN_KAFKA_BROKERS: kafka:9092
      DOCTORS_ADMIN_KAFKA_GROUP_ID: admin-service
      DOCTORS_ADMIN_JWT_SECRET: dev-secret-change-me
      DOCTORS_ADMIN_LOGGING_LEVEL: info
      # admin 内部服务 baseURL（容器名 + 服务端口）
      # env 路径遵循 DOCTORS_<SERVICE>_<FIELD> 形式，admin.order_base_url → DOCTORS_ADMIN_ORDER_BASE_URL
      DOCTORS_ADMIN_ORDER_BASE_URL: http://order-service:8080
      DOCTORS_ADMIN_REFUND_BASE_URL: http://review-service:8080
      DOCTORS_ADMIN_ESCORT_BASE_URL: http://escort-service:8080
      DOCTORS_ADMIN_USER_BASE_URL: http://user-service:8080
    ports:
      - "8091:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "-healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
      review-service:
        condition: service_started
      escort-service:
        condition: service_started
      user-service:
        condition: service_started

  # ============================================================
  # 3 个前端服务（nginx 静态托管）
  # ============================================================
  patient-miniapp:
    image: doctors/patient-miniapp:latest
    build:
      context: ./frontend/patient-miniapp
      dockerfile: Dockerfile
    container_name: doctors-patient-miniapp
    ports:
      - "80:80"
    networks:
      - doctors-net
    restart: unless-stopped
    # nginx 镜像自带 wget；Dockerfile 内已声明 HEALTHCHECK

  escort-app:
    image: doctors/escort-app:latest
    build:
      context: ./frontend/escort-app
      dockerfile: Dockerfile
    container_name: doctors-escort-app
    ports:
      - "8080:80"
    networks:
      - doctors-net
    restart: unless-stopped

  admin-web:
    image: doctors/admin-web:latest
    build:
      context: ./frontend/admin-web
      dockerfile: Dockerfile
    container_name: doctors-admin-web
    ports:
      - "8092:80"
    networks:
      - doctors-net
    restart: unless-stopped

# ============================================================
# 网络
# ============================================================
networks:
  doctors-net:
    driver: bridge
    name: doctors-net

# ============================================================
# 卷（持久化中间件数据；Go 服务 ./config bind mount 不在此列）
# ============================================================
volumes:
  doctors-data-pg:
    name: doctors-data-pg
  doctors-data-redis:
    name: doctors-data-redis
  doctors-data-kafka:
    name: doctors-data-kafka