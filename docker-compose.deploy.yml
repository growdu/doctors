# 陪诊师平台 · 全量部署编排（11 Go 服务 + 3 前端 + 3 中间件）
#
# 与 docker-compose.yml（仅 dev 中间件）并存：
#   - 本文件用于本地 build + 一键拉起全套服务
#   - 镜像 tag：doctors/<svc>:latest（本地 build）
#
# 用法：
#   docker compose -f docker-compose.deploy.yml build        # 构建 14 个镜像
#   docker compose -f docker-compose.deploy.yml up -d        # 后台拉起
#   docker compose -f docker-compose.deploy.yml ps           # 查看状态
#   docker compose -f docker-compose.deploy.yml logs -f auth-service
#   docker compose -f docker-compose.deploy.yml down         # 停止
#
# 设计要点：
#   - 网络 doctors-net：所有服务互连，DNS 解析走容器名
#   - 卷 doctors-config：./config 目录以 bind mount 形式挂到 /app/config
#   - 卷 doctors-data-{pg,redis,kafka}：持久化中间件数据
#   - depends_on.condition: service_healthy：避免 Go 服务在 PG/Redis/Kafka
#     未就绪时启动后立即 panic
#   - 服务端口仅暴露给宿主机（`ports:` 段）；容器间用服务名通信
#   - 每个 Go 服务的 ENV 注入严格遵循 DOCTORS_<UPPER_SVC>_* 命名（与 shared/config 对齐）
#
# 端口分配（host 侧）：
#   8081 auth / 8082 order / 8083 match / 8084 message / 8085 payment
#   8086 review / 8087 sos / 8088 user / 8089 escort / 8090 wallet
#   8091 admin / 80 patient-miniapp / 8080 escort-app / 8092 admin-web

name: doctors

services:
  # ============================================================
  # 中间件
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: doctors-postgres
    environment:
      POSTGRES_USER: doctors
      POSTGRES_PASSWORD: doctors
      POSTGRES_DB: doctors
    ports:
      - "5432:5432"
    volumes:
      - doctors-data-pg:/var/lib/postgresql/data
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctors -d doctors"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: doctors-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - doctors-data-redis:/data
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Apache Kafka 官方镜像，KRaft 单节点（无 Zookeeper）
    image: apache/kafka:3.9.1
    container_name: doctors-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - doctors-data-kafka:/tmp/kraft-combined-logs
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # 11 个 Go 服务（按启动顺序排列；depends_on 严格 healthcheck）
  # ============================================================
  auth-service:
    image: doctors/auth:latest
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      args:
        SVC: auth
    container_name: doctors-auth
    environment:
      DOCTORS_AUTH_HTTP_ADDR: ":8080"
      DOCTORS_AUTH_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_AUTH_REDIS_ADDR: redis:6379
      DOCTORS_AUTH_KAFKA_BROKERS: kafka:9092
      DOCTORS_AUTH_KAFKA_GROUP_ID: auth-service
      DOCTORS_AUTH_JWT_SECRET: dev-secret-change-me
      DOCTORS_AUTH_LOGGING_LEVEL: info
    ports:
      - "8081:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "-healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    image: doctors/order:latest
    build:
      context: .
      dockerfile: services/order/Dockerfile
      args:
        SVC: order
    container_name: doctors-order
    environment:
      DOCTORS_ORDER_HTTP_ADDR: ":8080"
      DOCTORS_ORDER_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_ORDER_REDIS_ADDR: redis:6379
      DOCTORS_ORDER_KAFKA_BROKERS: kafka:9092
      DOCTORS_ORDER_KAFKA_GROUP_ID: order-service
      DOCTORS_ORDER_JWT_SECRET: dev-secret-change-me
      DOCTORS_ORDER_LOGGING_LEVEL: info
    ports:
      - "8082:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "-healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  match-service:
    image: doctors/match:latest
    build:
      context: .
      dockerfile: services/match/Dockerfile
      args:
