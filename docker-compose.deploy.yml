      DOCTORS_USER_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_USER_REDIS_ADDR: redis:6379
      DOCTORS_USER_KAFKA_BROKERS: kafka:9092
      DOCTORS_USER_KAFKA_GROUP_ID: user-service
      DOCTORS_USER_JWT_SECRET: dev-secret-change-me
