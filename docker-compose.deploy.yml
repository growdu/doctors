    container_name: doctors-sos
    environment:
      DOCTORS_SOS_HTTP_ADDR: ":8080"
      DOCTORS_SOS_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_SOS_REDIS_ADDR: redis:6379
      DOCTORS_SOS_KAFKA_BROKERS: kafka:9092
      DOCTORS_SOS_KAFKA_GROUP_ID: sos-service
      DOCTORS_SOS_JWT_SECRET: dev-secret-change-me
