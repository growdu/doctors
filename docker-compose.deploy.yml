      DOCTORS_MATCH_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_MATCH_REDIS_ADDR: redis:6379
      DOCTORS_MATCH_KAFKA_BROKERS: kafka:9092
      DOCTORS_MATCH_KAFKA_GROUP_ID: match-service
      DOCTORS_MATCH_JWT_SECRET: dev-secret-change-me
      DOCTORS_MATCH_LOGGING_LEVEL: info
    ports:
      - "8083:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - doctors-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "-healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  message-service:
    image: doctors/message:latest
    build:
      context: .
      dockerfile: services/message/Dockerfile
      args:
        SVC: message
    container_name: doctors-message
    environment:
      DOCTORS_MESSAGE_HTTP_ADDR: ":8080"
      DOCTORS_MESSAGE_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_MESSAGE_REDIS_ADDR: redis:6379
      DOCTORS_MESSAGE_KAFKA_BROKERS: kafka:9092
      DOCTORS_MESSAGE_KAFKA_GROUP_ID: message-service
      DOCTORS_MESSAGE_JWT_SECRET: dev-secret-change-me
      DOCTORS_MESSAGE_LOGGING_LEVEL: info
    ports:
