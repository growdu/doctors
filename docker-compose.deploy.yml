      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  review-service:
    image: doctors/review:latest
    build:
      context: .
      dockerfile: services/review/Dockerfile
      args:
        SVC: review
    container_name: doctors-review
    environment:
      DOCTORS_REVIEW_HTTP_ADDR: ":8080"
      DOCTORS_REVIEW_DB_DSN: postgres://doctors:doctors@postgres:5432/doctors?sslmode=disable
      DOCTORS_REVIEW_REDIS_ADDR: redis:6379
      DOCTORS_REVIEW_KAFKA_BROKERS: kafka:9092
      DOCTORS_REVIEW_KAFKA_GROUP_ID: review-service
      DOCTORS_REVIEW_JWT_SECRET: dev-secret-change-me
      DOCTORS_REVIEW_LOGGING_LEVEL: info
    ports:
