# payment-service 本地配置示例（2026-09-24 补全）
# DOCTORS_PAYMENT_HTTP_ADDR=:8085 等环境变量可覆盖同名字段
service: payment

http:
  addr: ":8085"
  read_timeout_sec: 30
  write_timeout_sec: 30

db:
  dsn: postgres://doctors:doctors@127.0.0.1:5432/doctors?sslmode=disable
  max_conns: 10
  min_conns: 2

redis:
  addr: 127.0.0.1:6379
  db: 0

kafka:
  brokers:
    - 127.0.0.1:9092
  group_id: payment-service

auth:
  jwt_secret: dev-secret-change-me
  jwt_ttl: 3600000000000  # 1h

logging:
  level: info

# OTel 全链路追踪（§26 tracing plan）：endpoint 留空 → Noop，不导出 span。
tracing:
  otlp_endpoint: ""