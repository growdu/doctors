site_name: 陪诊师平台 — 设计与实施文档
site_description: MVP v1.0 全链路文档（架构 / 业务 / Spec / Plan / 实施记录）
site_author: growdu
site_url: https://growdu.github.io/doctors/
repo_url: https://github.com/growdu/doctors
repo_name: growdu/doctors
edit_uri: edit/main/

docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: 目录
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 业务文档:
      - 1. 项目概述: 01-项目概述.md
      - 2. 角色与权限: 02-角色与权限.md
      - 3. 功能需求: 03-功能需求.md
      - 4. 业务流程: 04-业务流程.md
      - 5. 非功能需求: 05-非功能需求.md
      - 6. 系统架构: 06-系统架构.md
      - 7. 数据模型: 07-数据模型.md
      - 8. 接口需求: 08-接口需求.md
      - 9. 验收与发布: 09-验收与发布.md
  - Specs:
      - 总路线图: superpowers/specs/2026-09-24-roadmap-design.md
      - L2 后端 API Gap: superpowers/specs/2026-09-24-l2-api-gap-design.md
      - patient-miniapp 设计: superpowers/specs/2026-09-24-patient-miniapp-design.md
      - escort-app 设计: superpowers/specs/2026-09-24-escort-app-design.md
      - admin-web 设计: superpowers/specs/2026-09-24-admin-web-design.md
      - 订单匹配模式重构: superpowers/specs/2026-09-24-order-matching-redesign.md
  - Plans:
      - 路线图汇总: superpowers/plans/2026-09-23-doctors-v1.md
      - 后端:
          - state-machine: superpowers/plans/2026-09-24-state-machine.md
          - order-lock: superpowers/plans/2026-09-24-order-lock.md
          - escort-order-ext: superpowers/plans/2026-09-24-escort-order-ext.md
          - escort-business: superpowers/plans/2026-09-24-escort-business.md
          - escort-availability: superpowers/plans/2026-09-24-escort-availability.md
          - sos: superpowers/plans/2026-09-24-sos.md
          - virtual-number: superpowers/plans/2026-09-24-virtual-number.md
          - hospital-package: superpowers/plans/2026-09-24-hospital-package.md
          - address-coupon: superpowers/plans/2026-09-24-address-coupon.md
          - refund: superpowers/plans/2026-09-24-refund.md
          - review: superpowers/plans/2026-09-24-review.md
          - message: superpowers/plans/2026-09-24-message.md
          - wallet: superpowers/plans/2026-09-24-wallet.md
          - admin 后端: superpowers/plans/2026-09-24-admin.md
      - 前端:
          - patient-miniapp setup: superpowers/plans/2026-09-24-patient-miniapp-setup.md
          - escort-app setup: superpowers/plans/2026-09-24-escort-app-setup.md
          - admin-web setup: superpowers/plans/2026-09-24-admin-web-setup.md
  - 图纸:
      - 架构图导览: diagrams/README.md
      - 图纸样式指南: diagrams/style-guide.md
  - 评审报告: REVIEW-REPORT.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/growdu
  alternate_symbol: ↗
  hide_generator: true