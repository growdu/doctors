  <p class="eyebrow">DIAGRAM · 01 / ARCHITECTURE</p>
  <h1>陪诊师平台 · 系统总体架构</h1>
  <p class="subtitle">三层接入 + 十二个 Go 微服务 + 统一 PostgreSQL/Kafka 数据层 + 三方集成。技术栈：<strong style="color:var(--accent)">Go 1.22 + PostgreSQL 16 + Patroni</strong>。焦点落在<strong style="color:var(--accent)">订单 → 匹配 → 支付</strong>主链路。</p>

<title id="arch01-title">陪诊师平台系统总体架构</title>
<desc id="arch01-desc">三层分层架构：客户端层（iOS、Android、微信小程序、Admin Web）接入 API 网关，网关路由到十二个 Go 业务域服务，业务域经 Kafka 异步、Redis 缓存、PostgreSQL 16 持久化（含 JSONB / FOR UPDATE SKIP LOCKED / Patroni 高可用）、ES 检索，对接微信支付、实名、短信、地图、推送等三方服务。</desc>
