name: escort_app
description: Doctors Escort App (陪诊师端 Flutter App)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 路由
  go_router: ^14.6.0
  # HTTP
  dio: ^5.7.0
  # 安全存储（JWT）
  flutter_secure_storage: ^9.2.2
  # 普通 KV
  shared_preferences: ^2.3.3
  # GPS 定位
  geolocator: ^13.0.1
  # 运行时权限
  permission_handler: ^11.3.1
  # 图片选择
  image_picker: ^1.1.2
  # 图片压缩
  flutter_image_compress: ^2.3.0
  # 图标
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true