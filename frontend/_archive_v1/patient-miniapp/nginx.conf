# patient-miniapp nginx 配置
# 静态 SPA 托管；H5 默认 hash 路由（#/...）不需要 try_files，
# 但保留 history fallback 以防未来切到 history 模式。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 启用 gzip（uni-app 资源多为文本）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA fallback（hash 路由时通常不走这里；history 路由时必需）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康探针（容器内）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}