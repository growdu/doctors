# escort-app nginx 配置（Flutter Web）
# Flutter web 默认 history 路由（无 hash），所以 try_files 回退到 index.html 必需。

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Flutter web 资源带 base16 hash，长缓存安全
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：所有未命中路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web 编译产物里有 canvaskit，需要 wasm MIME
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}